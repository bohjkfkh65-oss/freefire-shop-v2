<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيع حسابك - FreeFire Shop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="page-container">

    <div class="sell-account-box">

        <div class="sell-account-header">
            <div class="sell-account-icon">🎮</div>
            <h1>بيع حسابك</h1>
            <p>اعرض حسابك للبيع داخل متجر FreeFire Shop</p>
        </div>

        <form method="POST"
              action="{{ url_for('sell_account') }}"
              enctype="multipart/form-data">

            <div class="form-group">
                <label>اسم الحساب</label>
                <input
                    type="text"
                    name="title"
                    placeholder="مثال: حساب Free Fire لفل 70"
                    required
                >
            </div>

            <div class="form-group">
                <label>تفاصيل الحساب</label>
                <textarea
                    name="description"
                    rows="6"
                    placeholder="اكتب مستوى الحساب، الشخصيات، الأسلحة، الأزياء وأهم المميزات..."
                    required
                ></textarea>
            </div>

            <div class="form-group">
                <label>السعر</label>
                <input
                    type="number"
                    name="price"
                    min="1"
                    step="1"
                    placeholder="مثال: 150000"
                    required
                >
            </div>

            <div class="form-group">
                <label>صور الحساب</label>
                <input
                    type="file"
                    name="images"
                    accept="image/jpeg,image/png,image/webp"
                    multiple
                    required
                >
                <small>يمكنك اختيار أكثر من صورة للحساب.</small>
            </div>

            <button type="submit" class="sell-account-btn">
                🚀 إرسال الحساب للمراجعة
            </button>

        </form>

        <a href="{{ url_for('home') }}" class="back-home">
            ← العودة للرئيسية
        </a>

    </div>

</div>

</body>
</html>
