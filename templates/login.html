<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - FreeFire Shop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">🔐</div>

        <h1>تسجيل الدخول</h1>
        <p>مرحبًا بك من جديد 👋</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label>البريد الإلكتروني</label>
            <input type="email" name="email" required>

            <label>كلمة المرور</label>
            <input type="password" name="password" required>

            <button type="submit">دخول</button>

        </form>

        <div class="auth-link" style="margin-top: 15px;">
    <a href="{{ url_for('forgot_password') }}">
        🔑 نسيت كلمة المرور؟
    </a>
</div>
<div class="auth-link">
            ليس لديك حساب؟
            <a href="{{ url_for('register') }}">إنشاء حساب</a>
        </div>

        <a class="back-link" href="{{ url_for('home') }}">العودة للمتجر</a>

    </div>

</div>

</body>
</html>
