<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صندوق المقترحات 💡</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header class="header">
    <h1>💡 صندوق المقترحات</h1>
    <p>رأيك يساعدنا على تطوير المتجر</p>

    <div class="nav-buttons">
        <a href="{{ url_for('home') }}">🏠 الرئيسية</a>
        <a href="{{ url_for('orders') }}">🛒 طلباتي</a>
        <a href="{{ url_for('wallet') }}">💰 المحفظة</a>
    </div>
</header>

<main class="container">

    <div class="suggestion-card">

        <div class="suggestion-icon">💡</div>

        <h2>شاركنا اقتراحك</h2>

        <p>
            هل لديك فكرة أو خدمة تريد إضافتها للمتجر؟
            اكتبها هنا وسنراجعها.
        </p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <textarea
                name="message"
                placeholder="اكتب اقتراحك هنا..."
                required
                maxlength="2000"
            ></textarea>

            <button type="submit">
                💡 إرسال الاقتراح
            </button>

        </form>

    </div>

</main>

</body>
</html>
